services:
  notification-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-bridge
    ports:
      - "8088:8000"
    volumes:
      - ./.env:/app/.env:ro  # 只读挂载 .env 文件到容器
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
